# packages/harness — the one model abstraction; no vendor SDK is imported anywhere (ADR-0002).
[project]
name = "databridge-harness"
version = "0.0.0"
description = "DataBridge model harness: one provider-neutral chat-completions client for every model call"
requires-python = ">=3.11"
dependencies = [
  "databridge-core",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["databridge_harness"]
