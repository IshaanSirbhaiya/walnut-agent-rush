# CI for Walnut DataBridge (Internal Brain).
# Two jobs: the Internal Brain backend tests (Python 3.13) and the web app typecheck (Node 20).
# No secrets are used: the tests run on the synthetic world with the built-in dev keys, and no
# model is called (no IB_MODEL_URL is set, so the deterministic path is used).
name: CI

on:
  push:
    branches: [main, neutral]
  pull_request:
    branches: [main, neutral]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Internal Brain tests (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: databridge
    env:
      # same paths as AGENTS.md "Running it", with ':' as the separator on Linux
      PYTHONPATH: apps/internal_brain:packages/core:packages/harness:packages/adapter:packages/retrieval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: databridge/requirements-lock.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run Internal Brain tests
        run: python -m pytest apps/internal_brain/tests -q

  web:
    name: Web app typecheck (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: databridge/apps/internal_brain_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: databridge/apps/internal_brain_web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
